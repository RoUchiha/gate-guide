<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gate Guide — live airport gate guidance</title>
    <meta name="description" content="Track your flight and get the fastest walking route to your gate, with closure-aware and accessible directions.">
    <meta name="theme-color" content="#0a1624">
    <meta property="og:title" content="Gate Guide">
    <meta property="og:description" content="Live gate guidance: flight tracking plus the fastest walking route to your gate.">
    <meta property="og:type" content="website">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gate Guide">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 100 100" aria-hidden="true" class="brand-mark">
            <polyline points="28,73 50,73 50,42 73,42" fill="none" stroke="#2fe0c8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <circle cx="28" cy="73" r="10" fill="#f0a92e"></circle>
            <circle cx="73" cy="42" r="9" fill="#e9f2fa"></circle>
          </svg>
          <span class="brand-name">Gate<b>Guide</b></span>
        </div>
        <div class="topbar-side">
          <label class="airport-pick">
            <span class="airport-pick-label">Airport</span>
            <select id="airport-select" aria-label="Choose airport"></select>
          </label>
          <span class="status-pill" id="provider-health" role="status" aria-live="polite">Connecting…</span>
        </div>
      </header>

      <main class="layout">
        <aside class="rail" aria-label="Flight and route">
          <form id="flight-form" class="flight-form">
            <label class="field field-airline">
              <span>Airline</span>
              <input id="airline" autocomplete="off" value="AA" maxlength="3" pattern="[A-Za-z0-9]{2,3}" title="2-3 character airline code, like AA or DL" required>
            </label>
            <label class="field field-number">
              <span>Flight</span>
              <input id="flight-number" autocomplete="off" value="1442" inputmode="numeric" pattern="\d{1,4}[A-Za-z]?" title="Flight number, like 1442" required>
            </label>
            <label class="field field-date">
              <span>Date</span>
              <input id="flight-date" type="date" required>
            </label>
            <button id="track-flight" type="submit" class="primary">Track flight</button>
          </form>

          <div class="start-row" role="group" aria-label="Where are you now">
            <span class="start-label">Start from</span>
            <button id="use-gps" type="button" class="ghost">GPS</button>
            <button id="locate-security" type="button" class="ghost">Security</button>
            <button id="locate-arrival" type="button" class="ghost">Entrance</button>
            <label class="toggle">
              <input id="accessible-mode" type="checkbox">
              <span>Step-free</span>
            </label>
          </div>

          <section class="gate-card" aria-label="Your gate">
            <p class="eyebrow">Proceed to gate</p>
            <div class="gate-row">
              <div class="gate-code" id="gate-code" aria-live="polite">—</div>
              <div class="route-meta" id="route-meta"></div>
            </div>
            <p class="route-sub" id="route-title" aria-live="polite">Pick a flight or tap a gate on the map</p>
          </section>

          <ol id="route-steps" class="route-steps" aria-label="Directions"></ol>

          <section class="panel" aria-label="Current flight">
            <h2>Flight</h2>
            <div id="flight-card" class="flight-card"></div>
          </section>

          <details class="panel wifi-panel">
            <summary>Airport Wi-Fi</summary>
            <div id="wifi-card" class="wifi-card"></div>
            <button id="join-wifi" type="button" class="ghost wide">Connect to airport Wi-Fi</button>
          </details>

          <section class="panel updates-panel" aria-label="Updates">
            <h2>Updates</h2>
            <ul id="alerts" class="alerts" aria-live="polite"></ul>
          </section>

          <p class="map-attribution" id="map-attribution"></p>
        </aside>

        <section class="stage" aria-label="Airport map">
          <div class="map-viewport">
            <svg id="map" class="terminal-map" viewBox="0 0 920 560" role="img" aria-label="Blueprint airport map with route. Drag to pan, scroll or pinch to zoom. Tap an entrance to start there."></svg>
            <div class="map-chip" id="map-title">Airport map</div>
            <svg class="map-compass" viewBox="0 0 40 40" aria-label="North is up">
              <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"></circle>
              <path d="M20 6 L24 22 L20 19 L16 22 Z" fill="currentColor"></path>
              <path d="M20 34 L24 22 L20 25 L16 22 Z" fill="currentColor" opacity="0.35"></path>
              <text x="20" y="15.5" text-anchor="middle" font-size="8" font-weight="800" fill="#0d2137">N</text>
            </svg>
            <div class="map-fabs">
              <div id="floor-controls" class="floor-controls" role="group" aria-label="Floor"></div>
              <div class="fab-stack" role="group" aria-label="Zoom">
                <button id="zoom-in" type="button" class="fab" title="Zoom in" aria-label="Zoom in">+</button>
                <button id="zoom-out" type="button" class="fab" title="Zoom out" aria-label="Zoom out">−</button>
                <button id="reset-view" type="button" class="fab" title="Reset view" aria-label="Reset view">⌂</button>
              </div>
            </div>
            <div class="map-scalebar" id="map-scalebar"></div>
            <div class="map-legend" id="map-legend"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/app-assets/app.js"></script>
  </body>
</html>
