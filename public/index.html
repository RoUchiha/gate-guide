<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gate Guide — live airport gate guidance</title>
    <meta name="description" content="Track your flight and get the fastest walking route to your gate, with closure-aware and accessible directions.">
    <meta name="theme-color" content="#102a3a">
    <meta property="og:title" content="Gate Guide">
    <meta property="og:description" content="Live gate guidance: flight tracking plus the fastest walking route to your gate.">
    <meta property="og:type" content="website">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gate Guide">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="command-panel" aria-label="Trip setup and controls">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Gate Guide</p>
            <h1>Live gate guidance</h1>
          </div>
          <span class="status-pill" id="provider-health" role="status" aria-live="polite">Checking providers</span>
        </div>

        <form id="flight-form" class="flight-form">
          <label>
            Airline
            <input id="airline" autocomplete="off" value="AA" maxlength="3" pattern="[A-Za-z0-9]{2,3}" title="2-3 character airline code, like AA or DL" required>
          </label>
          <label>
            Flight
            <input id="flight-number" autocomplete="off" value="1442" inputmode="numeric" pattern="\d{1,4}[A-Za-z]?" title="Flight number, like 1442" required>
          </label>
          <label>
            Date
            <input id="flight-date" type="date" required>
          </label>
          <button id="track-flight" type="submit">Track flight</button>
        </form>

        <div class="control-grid">
          <button id="locate-security" type="button">Start at security</button>
          <button id="locate-arrival" type="button">Start at arrival</button>
          <button id="use-gps" type="button">Use GPS</button>
          <label class="toggle-row">
            <input id="accessible-mode" type="checkbox">
            Accessible route
          </label>
        </div>

        <section class="info-panel" aria-label="Current flight">
          <h2>Flight</h2>
          <div id="flight-card" class="flight-card"></div>
        </section>

        <section class="info-panel" aria-label="Wi-Fi assistance">
          <h2>Wi-Fi</h2>
          <div id="wifi-card" class="wifi-card"></div>
          <button id="join-wifi" type="button">Connect to airport Wi-Fi</button>
        </section>

        <section class="info-panel" aria-label="Alerts">
          <h2>Alerts</h2>
          <ul id="alerts" class="alerts" aria-live="polite"></ul>
        </section>
      </section>

      <section class="map-panel" aria-label="Airport map and route">
        <div class="map-toolbar">
          <div>
            <p class="eyebrow" id="map-title">Airport map</p>
            <h2 id="route-title" aria-live="polite">Route to gate</h2>
          </div>
          <div class="map-toolbar-side">
            <select id="airport-select" aria-label="Choose airport"></select>
            <div class="route-meta" id="route-meta"></div>
          </div>
        </div>
        <svg id="map" class="terminal-map" viewBox="0 0 920 560" role="img" aria-label="Scaled terminal map with route"></svg>
        <p class="map-attribution" id="map-attribution"></p>
        <ol id="route-steps" class="route-steps"></ol>
      </section>
    </main>

    <script type="module" src="/app-assets/app.js"></script>
  </body>
</html>
